[package]
name = "snowlauncher-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "snowctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
directories = "6.0.0"
snowlauncher-core = { version = "0.1.0", path = "../snowlauncher-core" }
snowlauncher-wine = { version = "0.1.0", path = "../snowlauncher-wine" }
tokio = { version = "1.54.1", features = ["rt"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
