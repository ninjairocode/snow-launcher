[package]
name = "snowlauncher-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "snowd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
futures-util = { version = "0.3.34", default-features = false }
snowlauncher-core = { version = "0.1.0", path = "../snowlauncher-core" }
tokio = { version = "1.54.1", features = ["rt", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util"] }
