<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="220" viewBox="0 0 320 220">
  <title>Algo deu errado</title>
<path d="M 10 200 C 60 182, 260 182, 310 200 C 260 214, 60 214, 10 200 Z" fill="#e3eefc" stroke="#9fb6d8" stroke-width="2" stroke-linejoin="round"/>
