    <path d="M 33 70 C 30 58, 37 46, 51 44 C 59 43, 63 50, 62 58 C 61 66, 58 74, 50 77 C 42 79.5, 35 76, 33 70 Z" fill="#c9874f" stroke="none"/>

    <ellipse cx="41" cy="86" rx="5.5" ry="3.2" fill="#f2a7a1" stroke="none" opacity="0.5"/>
    <ellipse cx="87" cy="86" rx="5.5" ry="3.2" fill="#f2a7a1" stroke="none" opacity="0.5"/>

    <circle cx="49" cy="64" r="6" fill="#2b2233" stroke="none"/>
    <circle cx="51.2" cy="61.6" r="2.2" fill="#ffffff" stroke="none"/>
    <path d="M 72 65.5 C 75 61, 83 61, 86 65.5" fill="none" stroke-width="3.4"/>
    <path d="M 73 56.5 C 77 55, 82 55.3, 86 57" fill="none" stroke-width="2.6"/>

    <g fill="#4a4453" stroke="none" opacity="0.45">
      <circle cx="47" cy="91" r="1.1"/><circle cx="50.5" cy="95" r="1.1"/><circle cx="46" cy="97" r="1.1"/>
      <circle cx="81" cy="91" r="1.1"/><circle cx="77.5" cy="95" r="1.1"/><circle cx="82" cy="97" r="1.1"/>
