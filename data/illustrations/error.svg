    <path d="M 20 60 L 108 60 L 108 115 L 20 115 Z" fill="#c9874f"/>
    <g stroke="#a8693a" stroke-width="1.6" fill="none">
      <path d="M 21 74 L 107 74 M 21 88 L 107 88 M 21 102 L 107 102"/>
    </g>
