    <path d="M 53 82 C 53 76.5, 75 76.5, 75 82 C 75 88.5, 68.5 92, 64 92 C 59.5 92, 53 88.5, 53 82 Z" fill="#2b2233"/>
    <ellipse cx="59" cy="80.6" rx="3" ry="1.4" fill="#ffffff" stroke="none" opacity="0.5"/>

    <path d="M 64 92 L 64 96.5" fill="none"/>
    <path d="M 64 96.5 C 58 101, 51 100, 47 96.5" fill="none"/>
    <path d="M 64 96.5 C 71 99.5, 79 97.5, 84.5 91" fill="none"/>
    <path d="M 74.5 98 L 76.6 94.2 L 78.4 97.2 Z" fill="#ffffff" stroke-width="1.8"/>
  </g>

  <!-- chapéu de mago, inclinado, com lua -->
  <g stroke="#4a4453" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-8 62 32)">
    <ellipse cx="62" cy="33" rx="29" ry="5.5" fill="#2a63bf"/>
    <path d="M 41 31.5 C 47 22, 52 11, 63 4.5 C 71 0, 82 3, 81 11 C 77 8.5, 71 9.5, 71 15.5 C 71 21.5, 77 27, 83 31.5 C 70 35, 54 35, 41 31.5 Z" fill="#3c84e6"/>
