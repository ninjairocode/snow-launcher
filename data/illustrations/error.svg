  <!-- braço segurando o cajado -->
  <line x1="78" y1="96" x2="96.5" y2="84" stroke="#4a4453" stroke-width="11.5" stroke-linecap="round"/>
  <line x1="78" y1="96" x2="96.5" y2="84" stroke="#fbf9f7" stroke-width="7.2" stroke-linecap="round"/>
