<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-1"/>
      <polyline points="-0.34,-0.7 0,-0.48 0.34,-0.7"/>
    </g>
    <g id="flake">
      <use xlink:href="#arm"/>
      <use xlink:href="#arm" transform="rotate(60)"/>
      <use xlink:href="#arm" transform="rotate(120)"/>
      <use xlink:href="#arm" transform="rotate(180)"/>
      <use xlink:href="#arm" transform="rotate(240)"/>
      <use xlink:href="#arm" transform="rotate(300)"/>
    </g>
  </defs>

  <!-- montinho de neve -->
  <path d="M 12 116 C 28 106, 100 106, 116 116 C 100 123, 28 123, 12 116 Z" fill="#e3eefc" stroke="#9fb6d8" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 30 113 C 44 109.5, 62 109, 74 110" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <g stroke="#4a4453" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- corpo sentado -->
    <path d="M 45 115 C 43 104, 47 94, 56 91 L 74 91 C 83 94, 87 104, 85 115 Z" fill="#fbf9f7"/>
    <ellipse cx="46" cy="109" rx="8" ry="7" fill="#f1ece8"/>
    <path d="M 58 98 C 61 103, 69 103, 72 98" fill="none" stroke="#d9d2cc" stroke-width="2"/>
  </g>
  <!-- perna da frente (contorno + preenchimento) -->
  <line x1="56" y1="96" x2="56" y2="111" stroke="#4a4453" stroke-width="11.5" stroke-linecap="round"/>
  <line x1="56" y1="96" x2="56" y2="111" stroke="#fbf9f7" stroke-width="7.2" stroke-linecap="round"/>
  <path d="M 53.5 113.5 L 53.5 111 M 58.5 113.5 L 58.5 111" stroke="#c9c2bb" stroke-width="1.4" stroke-linecap="round"/>

  <!-- cabeça (desenhada grande, estilo chibi) -->
  <g transform="translate(12.8 -2) scale(0.8)" stroke="#4a4453" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 35 52 C 22 47, 7 56, 7 72 C 7 85, 16 91, 23 84 C 29 78, 31 68, 37 62 Z" fill="#f1ece8"/>
    <path d="M 93 52 C 106 47, 121 56, 121 72 C 121 85, 112 91, 105 84 C 99 78, 97 68, 91 62 Z" fill="#f1ece8"/>
    <path d="M 35 52 C 29 50, 22 52, 18 57 C 24 58, 30 60, 36 61 Z" fill="#c9874f" stroke="none"/>

    <path d="M 64 40 C 84 40, 98 50, 98 66 C 98 72, 97 76, 96 80 C 104 88, 104 104, 96 112 C 90 119, 78 122, 64 122 C 50 122, 38 119, 32 112 C 24 104, 24 88, 32 80 C 31 76, 30 72, 30 66 C 30 50, 44 40, 64 40 Z" fill="#fbf9f7"/>
    <path d="M 31 104 C 39 115, 54 117, 64 112.5 C 74 117, 89 115, 97 104 C 97 110, 91 117, 81 120 C 70 123, 58 123, 47 120 C 37 117, 31 110, 31 104 Z" fill="#ece5e0" stroke="none"/>

    <path d="M 33 70 C 30 58, 37 46, 51 44 C 59 43, 63 50, 62 58 C 61 66, 58 74, 50 77 C 42 79.5, 35 76, 33 70 Z" fill="#c9874f" stroke="none"/>

    <ellipse cx="41" cy="86" rx="5.5" ry="3.2" fill="#f2a7a1" stroke="none" opacity="0.5"/>
    <ellipse cx="87" cy="86" rx="5.5" ry="3.2" fill="#f2a7a1" stroke="none" opacity="0.5"/>

    <circle cx="49" cy="64" r="6" fill="#2b2233" stroke="none"/>
    <circle cx="51.2" cy="61.6" r="2.2" fill="#ffffff" stroke="none"/>
    <path d="M 72 65.5 C 75 61, 83 61, 86 65.5" fill="none" stroke-width="3.4"/>
    <path d="M 73 56.5 C 77 55, 82 55.3, 86 57" fill="none" stroke-width="2.6"/>

    <g fill="#4a4453" stroke="none" opacity="0.45">
      <circle cx="47" cy="91" r="1.1"/><circle cx="50.5" cy="95" r="1.1"/><circle cx="46" cy="97" r="1.1"/>
      <circle cx="81" cy="91" r="1.1"/><circle cx="77.5" cy="95" r="1.1"/><circle cx="82" cy="97" r="1.1"/>
    </g>

    <path d="M 53 82 C 53 76.5, 75 76.5, 75 82 C 75 88.5, 68.5 92, 64 92 C 59.5 92, 53 88.5, 53 82 Z" fill="#2b2233"/>
    <ellipse cx="59" cy="80.6" rx="3" ry="1.4" fill="#ffffff" stroke="none" opacity="0.5"/>

    <path d="M 64 92 L 64 96.5" fill="none"/>
    <path d="M 64 96.5 C 58 101, 51 100, 47 96.5" fill="none"/>
    <path d="M 64 96.5 C 71 99.5, 79 97.5, 84.5 91" fill="none"/>
    <path d="M 74.5 98 L 76.6 94.2 L 78.4 97.2 Z" fill="#ffffff" stroke-width="1.8"/>
  </g>

  <!-- chapéu de mago, inclinado, com lua -->
  <g stroke="#4a4453" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-8 62 32)">
    <ellipse cx="62" cy="33" rx="29" ry="5.5" fill="#2a63bf"/>
    <path d="M 41 31.5 C 47 22, 52 11, 63 4.5 C 71 0, 82 3, 81 11 C 77 8.5, 71 9.5, 71 15.5 C 71 21.5, 77 27, 83 31.5 C 70 35, 54 35, 41 31.5 Z" fill="#3c84e6"/>
    <path d="M 42.3 29 C 54 32.5, 70 32.5, 81.7 29 L 83 31.5 C 70 35, 54 35, 41 31.5 Z" fill="#f6d32d" stroke-width="1.8"/>
    <path d="M 58 14 C 54 16, 53 22, 57 25 C 54 25.5, 50.5 22.5, 51 18.5 C 51.5 14.5, 55 12.5, 58 14 Z" fill="#f6d32d" stroke="none"/>
    <circle cx="66" cy="22" r="1.4" fill="#ffffff" stroke="none"/>
    <circle cx="61" cy="9" r="1.1" fill="#ffffff" stroke="none"/>
  </g>

  <!-- braço segurando o cajado -->
  <line x1="78" y1="96" x2="96.5" y2="84" stroke="#4a4453" stroke-width="11.5" stroke-linecap="round"/>
  <line x1="78" y1="96" x2="96.5" y2="84" stroke="#fbf9f7" stroke-width="7.2" stroke-linecap="round"/>
  <g stroke="#4a4453" stroke-width="2.2" stroke-linecap="round">
    <ellipse cx="98" cy="82.5" rx="6" ry="5.2" fill="#fbf9f7" transform="rotate(-30 98 82.5)"/>
  </g>

  <!-- cajado -->
  <line x1="96" y1="116" x2="100.5" y2="44" stroke="#4a4453" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="116" x2="100.5" y2="44" stroke="#9a6236" stroke-width="3.4" stroke-linecap="round"/>

  <!-- dedinhos da pata fechados por cima do mastro -->
  <g stroke="#4a4453" stroke-width="2" fill="#fbf9f7">
    <ellipse cx="98.1" cy="80.6" rx="3.4" ry="2.5" transform="rotate(-8 98.1 80.6)"/>
    <ellipse cx="97.9" cy="84.6" rx="3.4" ry="2.5" transform="rotate(-8 97.9 84.6)"/>
  </g>

  <!-- ponta do cajado: floco de neve brilhando -->
  <circle cx="101" cy="38" r="11" fill="#dce8fa" stroke="#9fb6d8" stroke-width="1.6"/>
  <g transform="translate(101 38) scale(8) rotate(8)" fill="none" stroke="#3c84e6" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#flake"/>
  </g>

  <!-- floquinhos caindo -->
  <g fill="#9fb6d8">
    <circle cx="20" cy="40" r="2"/>
    <circle cx="26" cy="22" r="1.4"/>
    <circle cx="116" cy="62" r="1.8"/>
    <circle cx="112" cy="18" r="1.5"/>
    <circle cx="16" cy="94" r="1.4"/>
  </g>
</svg>
