# Checks every push to main and every pull request (project.md, section 9.4).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The GUI links against GTK 4 and libadwaita. Ubuntu 24.04 is the
      # minimum supported base (GTK 4.14, libadwaita 1.5; project.md).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The GUI links against GTK 4 and libadwaita. Ubuntu 24.04 is the
      # minimum supported base (GTK 4.14, libadwaita 1.5; project.md).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Tests marked #[ignore] need a desktop session (D-Bus, portal,
      # NetworkManager) and are not run here.
      - run: cargo nextest run --workspace --locked
      # nextest does not run doctests.
      - run: cargo test --workspace --doc --locked

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The GUI links against GTK 4 and libadwaita. Ubuntu 24.04 is the
      # minimum supported base (GTK 4.14, libadwaita 1.5; project.md).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # `+1.85.0` overrides rust-toolchain.toml, which pins `stable`.
      # Keep in sync with `rust-version` in Cargo.toml.
      - run: cargo +1.85.0 check --workspace --all-targets --locked

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Advisories (RustSec), licenses, banned crates and sources;
      # policy in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
